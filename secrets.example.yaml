# ============================================================================
# ESPHome Secrets File Template
# Rename this file to 'secrets.yaml' and fill it with your real data.
# ============================================================================

# Wi-Fi Configuration
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# ESPHome API Encryption Keys (Generate with: python3 -c "import secrets; print(secrets.token_hex(16))")
node1_api_encryption_key: "GENERATED_16_BYTE_HEX_KEY_NODE_01"
node2_api_encryption_key: "GENERATED_16_BYTE_HEX_KEY_NODE_02"

# Shared Security Passwords
node_ota_password: "YOUR_SECURE_OTA_PASSWORD"
node_fallback_ap_password: "YOUR_SECURE_FALLBACK_PASSWORD"
